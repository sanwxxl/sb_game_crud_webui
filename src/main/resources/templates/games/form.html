<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>게임 등록</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" th:href="@{/games}">Game Manager</a>
    </div>
</nav>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h1 class="h3 mb-4">새 게임 등록</h1>

                    <form th:action="@{/games}" method="post">
                        <div class="mb-3">
                            <label for="name" class="form-label">이름</label>
                            <input type="text" class="form-control" id="name" name="name" required>
                        </div>

                        <div class="mb-3">
                            <label for="company" class="form-label">회사</label>
                            <input type="text" class="form-control" id="company" name="company" required>
                        </div>

                        <div class="mb-3">
                            <label for="price" class="form-label">가격 (원)</label>
                            <input type="number" class="form-control" id="price" name="price" min="0" required>
                        </div>

                        <div class="mb-3">
                            <label for="genre" class="form-label">장르</label>
                            <input type="text" class="form-control" id="genre" name="genre" required>
                        </div>

                        <div class="mb-4">
                            <label for="playTime" class="form-label">플레이 시간 (시간)</label>
                            <input type="number" class="form-control" id="playTime" name="playTime" min="0" required>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary flex-fill">등록</button>
                            <a class="btn btn-outline-secondary flex-fill" th:href="@{/games}">목록으로</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
