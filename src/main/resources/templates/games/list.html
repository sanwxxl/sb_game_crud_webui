<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>게임 목록</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" th:href="@{/games}">Game Manager</a>
    </div>
</nav>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 mb-0">게임 목록</h1>
        <a class="btn btn-primary" th:href="@{/games/new}">+ 새 게임 등록</a>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>이름</th>
                        <th>회사</th>
                        <th>가격</th>
                        <th>장르</th>
                        <th>플레이 시간</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="game : ${games}">
                        <td th:text="${game.id}"></td>
                        <td th:text="${game.name}"></td>
                        <td th:text="${game.company}"></td>
                        <td th:text="${game.price} + '원'"></td>
                        <td><span class="badge bg-secondary" th:text="${game.genre}"></span></td>
                        <td th:text="${game.playTime} + '시간'"></td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(games)}">
                        <td colspan="6" class="text-center text-muted py-4">등록된 게임이 없습니다.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

</body>
</html>
